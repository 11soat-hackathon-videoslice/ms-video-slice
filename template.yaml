AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model template describing your function.
Parameters:
  AwsRegion:
    Type: String
    Description: Região AWS para recursos
  S3BucketName:
    Type: String
    Description: Nome do bucket S3 para armazenamento de vídeos
  S3BucketDirUploads:
    Type: String
    Description: Diretório de uploads no S3
  S3BucketDirFinished:
    Type: String
    Description: Diretório de vídeos finalizados no S3
  S3BucketDirProcessing:
    Type: String
    Description: Diretório de vídeos em processamento no S3
  EventBusName:
    Type: String
    Description: Nome do EventBridge Event Bus
  DynamoDbTableName:
    Type: String
    Description: Nome da tabela DynamoDB
  DynamoDbStreamArn:
    Type: String
    Description: ARN do DynamoDB Stream
  VdscPngCompressionLevel:
    Type: String
    Description: Nível de compressão PNG
  VdscZipCompressionLevel:
    Type: String
    Description: Nível de compressão ZIP
  VdscQuality:
    Type: String
    Description: Configuração de qualidade de vídeo

Resources:
  VdscLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vdsc-prd-lmb-video-slice
      RetentionInDays: 14

  vdscprdlmbvideoslice:
    Type: AWS::Serverless::Function
    DependsOn: VdscLambdaLogGroup
    Properties:
      FunctionName: vdsc-prd-lmb-video-slice
      CodeUri: src
      Description: 'Função Lambda para realizar captura de imagens do video'
      MemorySize: 256
      Timeout: 60
      Handler: src.aws.handler.vdsc_process_handler.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      EphemeralStorage:
        Size: 512
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 21600
        MaximumRetryAttempts: 2
      PackageType: Zip
      Role: arn:aws:iam::080145351546:role/service-role/vdsc-prd-lmb-video-slice-role
      RecursiveLoop: Terminate
      SnapStart:
        ApplyOn: None
      DurableConfig:
        RetentionPeriodInDays: 14
        ExecutionTimeout: 900
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      Environment:
        Variables:
          AWS_REGION: !Ref AwsRegion
          S3_BUCKET_NAME: !Ref S3BucketName
          S3_BUCKET_DIR_UPLOADS: !Ref S3BucketDirUploads
          S3_BUCKET_DIR_FINISHED: !Ref S3BucketDirFinished
          S3_BUCKET_DIR_PROCESSING: !Ref S3BucketDirProcessing
          EVENT_BUS_NAME: !Ref EventBusName
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
          VDSC_PNG_COMPRESSION_LEVEL: !Ref VdscPngCompressionLevel
          VDSC_ZIP_COMPRESSION_LEVEL: !Ref VdscZipCompressionLevel
          VDSC_QUALITY: !Ref VdscQuality
      Events:
        DynamoDBStream:
          Type: DynamoDB
          Properties:
            Stream: !Ref DynamoDbStreamArn
            StartingPosition: LATEST
            BatchSize: 1
            MaximumBatchingWindowInSeconds: 0
            ParallelizationFactor: 1
            MaximumRecordAgeInSeconds: -1
            MaximumRetryAttempts: -1
            BisectBatchOnFunctionError: false
            DestinationConfig:
              OnFailure:
                Destination: arn:aws:sqs:us-east-1:080145351546:vdsc-prd-dlq
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"], "dynamodb": {"NewImage": {"status": {"S": ["UPLOADED"]}}}}'
                - Pattern: '{"eventName": ["MODIFY"], "dynamodb": {"NewImage": {"status": {"S": ["RETRYING"]}}}}'
      AutoPublishAlias: PRD
