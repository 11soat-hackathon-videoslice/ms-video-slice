name: Build, Test and Deploy Lambda

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  PYTHON_VERSION: '3.12'
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  S3_BUCKET_DIR_UPLOADS: ${{ vars.S3_BUCKET_DIR_UPLOADS }}
  S3_BUCKET_DIR_FINISHED: ${{ vars.S3_BUCKET_DIR_FINISHED }}
  S3_BUCKET_DIR_PROCESSING: ${{ vars.S3_BUCKET_DIR_PROCESSING }}
  EVENT_BUS_NAME: ${{ vars.EVENT_BUS_NAME }}
  DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
  DYNAMODB_STREAM_ARN: ${{ vars.DYNAMODB_STREAM_ARN }}
  VDSC_PNG_COMPRESSION_LEVEL: ${{ vars.VDSC_PNG_COMPRESSION_LEVEL }}
  VDSC_ZIP_COMPRESSION_LEVEL: ${{ vars.VDSC_ZIP_COMPRESSION_LEVEL }}
  VDSC_QUALITY: ${{ vars.VDSC_QUALITY }}

jobs:
  tests-and-coverage:
    name: Testes e Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ vars.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache de dependências Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock boto3 moto requests opencv-python-headless
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: Executar testes com cobertura
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          pytest tests/ --cov=src --cov-report=xml:coverage.xml --cov-report=html --junitxml=test-results.xml -v

      - name: Verificar e corrigir arquivo de cobertura
        run: |
          ls -la
          if [ -f coverage.xml ]; then
            echo "✅ coverage.xml encontrado"
            echo "📋 Conteúdo antes da correção:"
            head -30 coverage.xml
            
            echo ""
            echo "🔧 Corrigindo caminhos absolutos no coverage.xml..."
            # Remover completamente a seção <sources>...</sources>
            sed -i '/<sources>/,/<\/sources>/d' coverage.xml
            # Adicionar prefixo src/ aos filenames que não começam com src/
            sed -i 's|filename="|filename="src/|g' coverage.xml
            # Corrigir casos onde src/ foi duplicado
            sed -i 's|filename="src/src/|filename="src/|g' coverage.xml
            
            echo ""
            echo "📋 Conteúdo após a correção:"
            head -30 coverage.xml
          else
            echo "❌ coverage.xml NÃO encontrado"
            exit 1
          fi

      - name: Upload de relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

      - name: Análise do SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=11soat-hackton-videoslice_ms-video-slice
            -Dsonar.organization=11soat-hackton-videoslice
            -Dsonar.projectName=ms-video-slice
            -Dsonar.projectVersion=1.0
            -Dsonar.branch.name=master
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.exclusions=**/__pycache__/**,**/__init__.py,**/tests/**,**/exemplo_rapido_test.py
            -Dsonar.language=py
            -Dsonar.python.version=3.12
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.coverage.exclusions=**/tests/**,**/__init__.py
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.python.xunit.reportPath=test-results.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.scm.provider=git
            -Dsonar.scm.forceReloadAll=false

  approval:
    name: Aprovação Manual
    runs-on: ubuntu-latest
    needs: tests-and-coverage
    if: github.event_name == 'pull_request'
    environment:
      name: production-approval
    steps:
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: gustavo-log,titoparizotto
          minimum-approvals: 1

  build-and-deploy:
    name: Build e Deploy na AWS
    runs-on: ubuntu-latest
    needs: [tests-and-coverage, approval]
    if: |
      always() &&
      needs.tests-and-coverage.result == 'success' &&
      (
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' && needs.approval.result == 'success')
      ) &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    # Se for push na develop: executa direto após tests-and-coverage (approval será skipped)
    # Se for pull_request para master: só executa após aprovação manual bem-sucedida

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ vars.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validar credenciais AWS
        run: |
          echo "🔍 Validando configuração AWS..."
          aws sts get-caller-identity
          echo "✅ Credenciais AWS configuradas corretamente"

      - name: Preparar pacote de build-and-deploy
        run: |
          echo "📦 Preparando pacote de build-and-deploy..."
          mkdir -p lambda-package
          
          if [ -f src/requirements-lambda.txt ]; then
            echo "📥 Instalando dependências Python de produção..."
            pip install -r src/requirements-lambda.txt -t lambda-package/ --quiet --no-cache-dir
          elif [ -f src/requirements.txt ]; then
            echo "⚠️ Usando requirements.txt (considere criar requirements-lambda.txt)"
            pip install -r src/requirements.txt -t lambda-package/ --quiet --no-cache-dir
          fi
          
          echo "📋 Copiando código fonte..."
          cp -r src/* lambda-package/
          
          echo "🧹 Removendo arquivos desnecessários para reduzir tamanho..."
          # Remover arquivos de cache e temporários
          find lambda-package -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type d -name "*.egg-info" -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type f -name "*.pyc" -delete 2>/dev/null || true
          find lambda-package -type f -name "*.pyo" -delete 2>/dev/null || true
          find lambda-package -type f -name "*.so" -exec strip {} \; 2>/dev/null || true
          
          # Remover testes e documentação de dependências
          find lambda-package -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find lambda-package -type f -name "*.md" -delete 2>/dev/null || true
          find lambda-package -type f -name "*.txt" ! -name "requirements.txt" -delete 2>/dev/null || true
          
          # Remover dependências de teste se presentes
          rm -rf lambda-package/pytest* 2>/dev/null || true
          rm -rf lambda-package/moto* 2>/dev/null || true
          rm -rf lambda-package/_pytest* 2>/dev/null || true
          rm -rf lambda-package/coverage* 2>/dev/null || true
          
          echo "🗜️ Criando arquivo ZIP..."
          cd lambda-package
          zip -r ../lambda-build-and-deployment-package.zip . -q -9
          cd ..
          
          PACKAGE_SIZE=$(ls -lh lambda-build-and-deployment-package.zip | awk '{print $5}')
          echo "📊 Tamanho do pacote final: ${PACKAGE_SIZE}"
          echo "✅ Pacote preparado com sucesso"
        env:
          PYTHON_REQUIRIMENTS: ${{ github.workspace }}/src/requirements.txt || {{vars.PYTHON_REQUIRIMENTS}}

      - name: Deploy via AWS CLI
        run: |
          echo "🚀 Iniciando build-and-deploy da Lambda via AWS CLI..."
          TIMESTAMP=$(date +%Y-%m-%dT%H:%M:%SZ)
          FUNCTION_NAME="vdsc-prd-lmb-video-slice"
          
          # Verificar tamanho do pacote
          PACKAGE_SIZE_BYTES=$(stat -c%s lambda-build-and-deployment-package.zip)
          PACKAGE_SIZE_MB=$((PACKAGE_SIZE_BYTES / 1024 / 1024))
          echo "📊 Tamanho do pacote: ${PACKAGE_SIZE_MB}MB (${PACKAGE_SIZE_BYTES} bytes)"
          
          # Se o pacote for maior que 50MB, fazer upload para S3 primeiro
          if [ ${PACKAGE_SIZE_BYTES} -gt 52428800 ]; then
            echo "⚠️ Pacote maior que 50MB, fazendo upload para S3..."
            S3_KEY="lambda-build-and-deployments/vdsc-prd-lmb-video-slice-${TIMESTAMP}.zip"
            
            aws s3 cp lambda-build-and-deployment-package.zip \
              s3://${{ env.S3_BUCKET_NAME }}/${S3_KEY} \
              --region ${{ env.AWS_REGION }} \
              --no-progress
            
            echo "✅ Upload para S3 concluído: s3://${{ env.S3_BUCKET_NAME }}/${S3_KEY}"
            echo ""
            echo "📤 Atualizando código da função Lambda via S3..."
            
            aws lambda update-function-code \
              --function-name ${FUNCTION_NAME} \
              --s3-bucket ${{ env.S3_BUCKET_NAME }} \
              --s3-key ${S3_KEY} \
              --region ${{ env.AWS_REGION }} \
              --no-cli-pager
          else
            echo "📤 Atualizando código da função Lambda via upload direto..."
            
            aws lambda update-function-code \
              --function-name ${FUNCTION_NAME} \
              --zip-file fileb://lambda-build-and-deployment-package.zip \
              --region ${{ env.AWS_REGION }} \
              --no-cli-pager
          fi
          
          echo "⏳ Aguardando conclusão da atualização do código..."
          aws lambda wait function-updated \
            --function-name ${FUNCTION_NAME} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Código atualizado com sucesso às ${TIMESTAMP}"
          
          echo ""
          echo "⚙️ Atualizando configurações da Lambda..."
          
          # Criar arquivo JSON com as variáveis de ambiente usando jq
          jq -n \
            --arg s3_bucket "${{ env.S3_BUCKET_NAME }}" \
            --arg s3_uploads "${{ env.S3_BUCKET_DIR_UPLOADS }}" \
            --arg s3_finished "${{ env.S3_BUCKET_DIR_FINISHED }}" \
            --arg s3_processing "${{ env.S3_BUCKET_DIR_PROCESSING }}" \
            --arg event_bus "${{ env.EVENT_BUS_NAME }}" \
            --arg dynamodb_table "${{ env.DYNAMODB_TABLE_NAME }}" \
            --arg png_compression "${{ env.VDSC_PNG_COMPRESSION_LEVEL }}" \
            --arg zip_compression "${{ env.VDSC_ZIP_COMPRESSION_LEVEL }}" \
            --arg quality "${{ env.VDSC_QUALITY }}" \
            '{Variables: {S3_BUCKET_NAME: $s3_bucket, S3_BUCKET_DIR_UPLOADS: $s3_uploads, S3_BUCKET_DIR_FINISHED: $s3_finished, S3_BUCKET_DIR_PROCESSING: $s3_processing, EVENT_BUS_NAME: $event_bus, DYNAMODB_TABLE_NAME: $dynamodb_table, VDSC_PNG_COMPRESSION_LEVEL: $png_compression, VDSC_ZIP_COMPRESSION_LEVEL: $zip_compression, VDSC_QUALITY: $quality}}' \
            > env-vars.json
          
          echo "📋 Variáveis de ambiente a serem configuradas:"
          cat env-vars.json
          
          aws lambda update-function-configuration \
            --function-name ${FUNCTION_NAME} \
            --region ${{ env.AWS_REGION }} \
            --environment file://env-vars.json \
            --no-cli-pager
          
          # Limpar arquivo temporário
          rm -f env-vars.json
          
          echo "⏳ Aguardando conclusão da atualização de configuração..."
          aws lambda wait function-updated \
            --function-name ${FUNCTION_NAME} \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Configurações atualizadas com sucesso"
          echo ""
          echo "🎉 Deploy concluído com sucesso às ${TIMESTAMP}"

      - name: Configurar Event Source Mapping do DynamoDB
        run: |
          echo "🔗 Configurando Event Source Mapping do DynamoDB..."
          FUNCTION_NAME="vdsc-prd-lmb-video-slice"
          
          if [ -z "${{ env.DYNAMODB_STREAM_ARN }}" ]; then
            echo "⚠️ DYNAMODB_STREAM_ARN não configurado. Pulando configuração."
            exit 0
          fi
          
          echo "🔍 Verificando Event Source Mapping existente..."
          MAPPING_UUID=$(aws lambda list-event-source-mappings \
            --function-name ${FUNCTION_NAME} \
            --region ${{ env.AWS_REGION }} \
            --query "EventSourceMappings[?EventSourceArn=='${{ env.DYNAMODB_STREAM_ARN }}'].UUID" \
            --output text \
            --no-cli-pager)
          
          if [ -n "$MAPPING_UUID" ] && [ "$MAPPING_UUID" != "None" ]; then
            echo "✅ Event Source Mapping encontrado: ${MAPPING_UUID}"
            echo "🔄 Atualizando configuração..."
            
            aws lambda update-event-source-mapping \
              --uuid ${MAPPING_UUID} \
              --region ${{ env.AWS_REGION }} \
              --batch-size 1 \
              --maximum-batching-window-in-seconds 0 \
              --enabled \
              --no-cli-pager
            
            echo "✅ Event Source Mapping atualizado"
          else
            echo "➕ Criando novo Event Source Mapping..."
            
            aws lambda create-event-source-mapping \
              --function-name ${FUNCTION_NAME} \
              --event-source-arn ${{ env.DYNAMODB_STREAM_ARN }} \
              --starting-position LATEST \
              --batch-size 1 \
              --maximum-batching-window-in-seconds 0 \
              --parallelization-factor 1 \
              --enabled \
              --filter-criteria 'Filters=[{Pattern="{\"eventName\":[\"INSERT\"],\"dynamodb\":{\"NewImage\":{\"status\":{\"S\":[\"UPLOADED\"]}}}}"}},{Pattern="{\"eventName\":[\"MODIFY\"],\"dynamodb\":{\"NewImage\":{\"status\":{\"S\":[\"RETRYING\"]}}}}"}]' \
              --region ${{ env.AWS_REGION }} \
              --no-cli-pager
            
            echo "✅ Event Source Mapping criado com sucesso"
          fi

      - name: Verificar status da função Lambda
        run: |
          echo "📋 Informações da função Lambda após build-and-deploy:"
          FUNCTION_NAME="vdsc-prd-lmb-video-slice"
          
          aws lambda get-function \
            --function-name ${FUNCTION_NAME} \
            --region ${{ env.AWS_REGION }} \
            --query 'Configuration.[FunctionName,Runtime,LastModified,State,Version,CodeSize,MemorySize,Timeout]' \
            --output table \
            --no-cli-pager
          
          echo ""
          echo "✅ Deploy finalizado com sucesso"
