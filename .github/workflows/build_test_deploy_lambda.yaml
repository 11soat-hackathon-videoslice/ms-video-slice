name: Build, Test and Deploy Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION }}
  S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
  S3_BUCKET_DIR_UPLOADS: ${{ vars.S3_BUCKET_DIR_UPLOADS }}
  S3_BUCKET_DIR_FINISHED: ${{ vars.S3_BUCKET_DIR_FINISHED }}
  S3_BUCKET_DIR_PROCESSING: ${{ vars.S3_BUCKET_DIR_PROCESSING }}
  EVENT_BUS_NAME: ${{ vars.EVENT_BUS_NAME }}
  DYNAMODB_TABLE_NAME: ${{ vars.DYNAMODB_TABLE_NAME }}
  DYNAMODB_STREAM_ARN: ${{ vars.DYNAMODB_STREAM_ARN }}
  VDSC_PNG_COMPRESSION_LEVEL: ${{ vars.VDSC_PNG_COMPRESSION_LEVEL }}
  VDSC_ZIP_COMPRESSION_LEVEL: ${{ vars.VDSC_ZIP_COMPRESSION_LEVEL }}
  VDSC_QUALITY: ${{ vars.VDSC_QUALITY }}

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Cache de dependências Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-mock boto3 moto requests opencv-python-headless
          if [ -f src/requirements.txt ]; then pip install -r src/requirements.txt; fi

      - name: Executar testes com cobertura
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html --junitxml=test-results.xml

      - name: Upload de relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            test-results.xml

      - name: Análise do SonarCloud
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=11soat-hackton-videoslice_ms-video-slice
            -Dsonar.organization=11soat-hackton-videoslice
            -Dsonar.projectName=ms-video-slice
            -Dsonar.branch.name=master
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.14

      - name: Verificar Quality Gate do SonarCloud
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  approval:
    name: Aprovação Manual
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    environment:
      name: production-approval
    steps:
      - name: Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: gustavo-log,titoparizotto
          minimum-approvals: 1

  deploy:
    name: Deploy na AWS
    runs-on: ubuntu-latest
    needs: [build-and-test, approval]
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
        (github.event_name == 'pull_request' && needs.approval.result == 'success')
      )
    # Se for push na develop: executa direto após build-and-test (approval será skipped)
    # Se for pull_request para master: só executa após aprovação manual bem-sucedid

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cache do SAM Build
        uses: actions/cache@v4
        with:
          path: .aws-sam
          key: ${{ runner.os }}-sam-${{ hashFiles('**/template.yaml') }}
          restore-keys: |
            ${{ runner.os }}-sam-

      - name: Instalar AWS SAM CLI
        run: |
          pip install aws-sam-cli

      - name: Build do SAM
        run: |
          sam build --cached --parallel

      - name: Deploy do SAM
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name ms-video-slice \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --resolve-s3 \
            --parameter-overrides \
              ParameterKey=AwsRegion,ParameterValue=${{ env.AWS_REGION }} \
              ParameterKey=AwsAccountId,ParameterValue=${{ env.AWS_ACCOUNT_ID }} \
              ParameterKey=S3BucketName,ParameterValue=${{ env.S3_BUCKET_NAME }} \
              ParameterKey=S3BucketDirUploads,ParameterValue=${{ env.S3_BUCKET_DIR_UPLOADS }} \
              ParameterKey=S3BucketDirFinished,ParameterValue=${{ env.S3_BUCKET_DIR_FINISHED }} \
              ParameterKey=S3BucketDirProcessing,ParameterValue=${{ env.S3_BUCKET_DIR_PROCESSING }} \
              ParameterKey=EventBusName,ParameterValue=${{ env.EVENT_BUS_NAME }} \
              ParameterKey=DynamoDbTableName,ParameterValue=${{ env.DYNAMODB_TABLE_NAME }} \
              ParameterKey=DynamoDbStreamArn,ParameterValue=${{ env.DYNAMODB_STREAM_ARN }} \
              ParameterKey=VdscPngCompressionLevel,ParameterValue=${{ env.VDSC_PNG_COMPRESSION_LEVEL }} \
              ParameterKey=VdscZipCompressionLevel,ParameterValue=${{ env.VDSC_ZIP_COMPRESSION_LEVEL }} \
              ParameterKey=VdscQuality,ParameterValue="${{ env.VDSC_QUALITY }}"

      - name: Obter informações da stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name ms-video-slice \
            --region ${{ env.AWS_REGION }} \
            --query 'Stacks[0].Outputs' \
            --output table
