[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vdsc-slice"
version = "1.0.0"
description = "Motor de processamento de captura de frames de videos"
authors = [
    { name="Tito Parizotto", email="titoparizotto@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "opencv-python-headless==4.10.0.84",
    "Pillow>=12.1.1",
    "numpy==1.26.4",
    "cryptography>=46.0.5",
    "zipstream-ng",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "aws_lambda_powertools>=3.24.0"
]

[project.urls]
"Homepage" = "https://github.com/11soat-hackton-videoslice/ms-video-slice-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: marca testes unitários"
]
